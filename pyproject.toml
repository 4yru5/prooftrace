[project]
name = "prooftrace"
version = "0.1.0"
description = "Exploitability-first security review agent: PR -> reachability -> validated exploit -> proof. 100% local, no API key."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "temporalio>=1.9",
  "langgraph>=0.2.40",
  "rich>=13.7",
  "textual>=0.80",
  "matplotlib>=3.8",
  "watchdog>=4.0",
]

[project.scripts]
prooftrace = "prooftrace.cli:main"

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-watcher>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prooftrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
