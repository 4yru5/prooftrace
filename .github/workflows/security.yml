name: ProofTrace security review
on: [push, pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync
      - name: Run ProofTrace on the changed code
        env:
          PROOFTRACE_LLM: stub          # deterministic in CI; swap to ollama where available
          PROOFTRACE_SANDBOX: subprocess
        run: uv run prooftrace analyze
      - name: Test suite
        run: uv run pytest -q
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prooftrace-proof
          path: artifacts/
